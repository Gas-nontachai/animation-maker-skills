name: Release npm

on:
  push:
    branches: [prod]

permissions:
  contents: read

concurrency:
  group: npm-animation-maker-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/prod'
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      action: ${{ steps.plan.outputs.action }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Validate package manifest
        run: node scripts/security-gate.mjs manifest

      - name: Plan release
        id: plan
        run: node scripts/release.mjs plan

      - name: Set release version
        if: steps.plan.outputs.action == 'publish'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          npm version "$VERSION" \
            --no-git-tag-version \
            --ignore-scripts \
            --allow-same-version

          npm pkg set "gitHead=$GITHUB_SHA"

          node -e "
            const p = require('./package.json');
            if (p.version !== process.env.VERSION) {
              throw new Error('Package version mismatch');
            }
          "

      - name: Test and prepare artifact
        if: steps.plan.outputs.action == 'publish'
        run: |
          npm ci --ignore-scripts
          npm run format:check
          npm run knip
          npm test
          npm run typecheck
          npm run security:check
          npm run test:package
          node scripts/release.mjs artifact

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.plan.outputs.action != 'skip' && success()
        with:
          name: npm-release
          path: |
            output/release-plan.json
            output/*.tgz
          if-no-files-found: error

      - name: Upload verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-evidence
          path: |
            output/audit-*.json
            output/phase1.7-package-evidence.json
          if-no-files-found: ignore

  publish:
    needs: prepare
    if: >-
      github.ref == 'refs/heads/prod' &&
      vars.NPM_RELEASE_ENABLED == 'true' &&
      needs.prepare.result == 'success' &&
      contains(fromJSON('["publish", "recover"]'), needs.prepare.outputs.action)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Ensure npm CLI supports OIDC
        run: |
          npm install -g npm@11
          npm --version
          node -e "
            const [major, minor, patch] = require('child_process')
              .execFileSync('npm', ['--version'], {encoding: 'utf8'})
              .trim().split('.').map(Number);
            if (!(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))))) {
              throw new Error('npm >=11.5.1 is required for OIDC publishing');
            }
          "

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-release
          path: output

      - name: Verify OIDC environment
        shell: bash
        run: |
          set -euo pipefail

          node --version
          npm --version
          npm config get registry

          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            echo "::error::GitHub OIDC request URL missing"
            exit 1
          fi

          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "::error::GitHub OIDC request token missing"
            exit 1
          fi

          echo "GitHub OIDC environment available"

      - name: Publish with OIDC, verify npm, then create tag (or recover)
        env:
          RELEASE_AUTHORIZED: ${{ vars.NPM_RELEASE_ENABLED }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs finish
